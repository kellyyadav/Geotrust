<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoTrust Navigator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:#1E2A38}
#map{position:absolute;inset:0}
#panel{position:absolute;z-index:1000;top:12px;left:12px;width:340px;max-height:calc(100% - 24px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.22);padding:14px}
h1{font-size:18px;margin:0}.sub{color:#5F6B7A;font-size:12px;margin-bottom:10px}
.row{display:flex;gap:6px;margin-bottom:8px}input{flex:1;min-width:0;padding:9px 10px;border:1px solid #cfd6df;border-radius:8px;font:inherit}
button{padding:9px 12px;border:0;border-radius:8px;background:#1D9E75;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.alt{background:#1E2A38}button.full{width:100%;margin-bottom:8px}
#route{font-size:15px;margin:4px 0 8px}#status{font-size:12px;color:#5F6B7A;min-height:18px;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.card{background:#F5F7FA;border-radius:8px;padding:6px 4px;text-align:center}.card b{display:block;font-size:17px}.card span{font-size:11px;color:#5F6B7A}
#log{list-style:none;margin:0 0 8px;padding:0;font-size:12px}#log li{background:#FFF4E0;border-left:3px solid #EF9F27;padding:4px 8px;margin-bottom:4px;border-radius:4px}
.legend{font-size:12px;color:#5F6B7A;margin-top:6px}.legend i{display:inline-block;width:12px;height:4px;margin:0 4px 2px 8px}
@media(max-width:700px){#panel{top:auto;bottom:0;left:0;right:0;width:100%;max-height:48%;border-radius:14px 14px 0 0}}
</style></head><body>
<div id="map"></div>
<div id="panel">
  <h1>GeoTrust Navigator</h1><div class="sub">Live GPS, corrected and trust-scored by the GeoTrust backend</div>
  <div class="row"><input id="q" placeholder="Search destination, e.g. Jaipur Junction"><button id="go">Go</button></div>
  <div id="route"></div>
  <button id="track" class="full">Start live tracking</button>
  <div id="status">Allow location access, then start tracking.</div>
  <div class="cards">
    <div class="card"><b id="sTrust">-</b><span>Trust</span></div><div class="card"><b id="sPts">0</b><span>Points</span></div>
    <div class="card"><b id="sFlag">0</b><span>Flagged</span></div><div class="card"><b id="sAcc">-</b><span>GPS m</span></div>
  </div>
  <ul id="log"></ul>
  <div class="row"><input id="dev" placeholder="Device ID"><button id="hist" class="alt">Load history</button></div>
  <div class="legend"><i style="background:#E24B4A"></i>Raw GPS<i style="background:#1D9E75"></i>Corrected<i style="background:#2563EB"></i>Route<i style="background:#EF9F27"></i>Flagged</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="config.js"></script>
<script>
const API = window.API_URL, $ = id => document.getElementById(id);
let dev; try { dev = localStorage.getItem('gt_dev'); } catch (e) {}
if (!dev) { dev = 'web-' + Math.random().toString(36).slice(2, 6); try { localStorage.setItem('gt_dev', dev); } catch (e) {} }
$('dev').value = dev;
const map = L.map('map', { zoomControl: false }).setView([26.9124, 75.7873], 13);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
const rawL = L.polyline([], { color: '#E24B4A', weight: 2, opacity: .7 }).addTo(map);
const corL = L.polyline([], { color: '#1D9E75', weight: 5 }).addTo(map);
const me = L.circleMarker([0, 0], { radius: 8, color: '#fff', weight: 3, fillColor: '#2563EB', fillOpacity: 1 });
const accC = L.circle([0, 0], { radius: 0, color: '#2563EB', weight: 1, fillOpacity: .1 });
const flagLayer = L.layerGroup().addTo(map);
let dest = null, destMk = null, routeL = null, watch = null, last = null, lastSent = 0, arrived = false;
let n = 0, flagged = 0, sumTrust = 0;
const status = t => $('status').textContent = t;
const flagDot = (p, txt) => L.circleMarker(p, { radius: 7, color: '#EF9F27', weight: 3, fillOpacity: 0 }).bindPopup(txt).addTo(flagLayer);
function dist(a, b) { const R = 6371000, r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function stats() { $('sPts').textContent = n; $('sFlag').textContent = flagged; $('sTrust').textContent = n ? Math.round(sumTrust / n) : '-'; }

async function send(pos) {
  if (Date.now() - lastSent < 1000) return; lastSent = Date.now();
  const c = pos.coords, body = { deviceId: dev, lat: c.latitude, lon: c.longitude, accuracy: c.accuracy, timestamp: pos.timestamp };
  try {
    const r = await fetch(API + '/api/v1/points', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    show(body, await r.json());
  } catch (e) { status('Backend error: ' + e.message + ' (free server may be waking up, retrying)'); }
}
function show(raw, d) {
  n++; sumTrust += d.trust; const ll = [d.lat, d.lon]; last = ll;
  rawL.addLatLng([raw.lat, raw.lon]); corL.addLatLng(ll);
  me.setLatLng(ll).addTo(map); accC.setLatLng(ll).setRadius(raw.accuracy).addTo(map);
  n === 1 ? map.setView(ll, 17) : map.panTo(ll);
  $('sAcc').textContent = Math.round(raw.accuracy);
  if (d.trust < 60) { flagged++; flagDot([raw.lat, raw.lon], 'trust ' + d.trust + ': ' + d.flags);
    const li = document.createElement('li'); li.textContent = new Date().toLocaleTimeString() + '  trust ' + d.trust + '  ' + d.flags;
    $('log').prepend(li); while ($('log').children.length > 5) $('log').lastChild.remove(); }
  stats(); status('Tracking live as ' + dev);
  if (dest && !arrived && dist(ll, dest) < 30) { arrived = true; status('You have reached your destination'); }
}
const locate = () => new Promise((ok, no) => navigator.geolocation.getCurrentPosition(p => ok([p.coords.latitude, p.coords.longitude]), () => no(new Error('Please allow location access')), { enableHighAccuracy: true, timeout: 15000 }));

async function go() {
  const q = $('q').value.trim(); if (!q) return; status('Searching...');
  try {
    const j = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q))).json();
    if (!j.length) { status('Place not found, try a more specific name'); return; }
    dest = [+j[0].lat, +j[0].lon]; arrived = false; if (destMk) destMk.remove();
    destMk = L.marker(dest).addTo(map).bindPopup(j[0].display_name.split(',').slice(0, 2).join(',')).openPopup();
    const from = last || await locate(); await route(from);
  } catch (e) { status('Failed: ' + e.message); }
}
async function route(from) {
  const u = `https://router.project-osrm.org/route/v1/driving/${from[1]},${from[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson`;
  const j = await (await fetch(u)).json();
  if (!j.routes || !j.routes.length) { status('No route found'); return; }
  const rt = j.routes[0]; if (routeL) routeL.remove();
  routeL = L.geoJSON(rt.geometry, { style: { color: '#2563EB', weight: 6, opacity: .6 } }).addTo(map);
  map.fitBounds(routeL.getBounds(), { padding: [40, 40] });
  $('route').innerHTML = `<b>${(rt.distance / 1000).toFixed(1)} km</b> · ${Math.round(rt.duration / 60)} min (driving route)`;
  status('Route ready. Start live tracking to follow it.');
}
$('go').onclick = go; $('q').onkeydown = e => { if (e.key === 'Enter') go(); };
$('track').onclick = () => {
  if (watch !== null) { navigator.geolocation.clearWatch(watch); watch = null; $('track').textContent = 'Start live tracking'; status('Tracking stopped'); return; }
  if (!navigator.geolocation) { status('Geolocation not supported on this browser'); return; }
  dev = $('dev').value.trim() || dev; try { localStorage.setItem('gt_dev', dev); } catch (e) {}
  watch = navigator.geolocation.watchPosition(send, e => status('Location error: ' + e.message), { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  $('track').textContent = 'Stop tracking'; status('Waiting for GPS fix...');
};
$('hist').onclick = async () => {
  const id = $('dev').value.trim(); status('Loading history...');
  try {
    const d = await (await fetch(`${API}/api/v1/devices/${encodeURIComponent(id)}/points?limit=500`)).json();
    if (!d.length) { status('No data for ' + id); return; }
    rawL.setLatLngs(d.map(p => [p.raw_lat, p.raw_lon])); corL.setLatLngs(d.map(p => [p.lat, p.lon]));
    flagLayer.clearLayers(); d.filter(p => p.trust < 60).forEach(p => flagDot([p.raw_lat, p.raw_lon], 'trust ' + p.trust + ': ' + p.flags));
    n = d.length; sumTrust = d.reduce((s, p) => s + p.trust, 0); flagged = d.filter(p => p.trust < 60).length; stats();
    map.fitBounds(corL.getBounds()); status('Showing history of ' + id);
  } catch (e) { status('Failed: ' + e.message); }
};
</script></body></html>
