<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoTrust</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#map{height:100%;margin:0}#box{position:absolute;z-index:999;top:10px;right:10px;background:#fff;padding:8px 12px;border-radius:6px;font:14px sans-serif}</style>
</head><body><div id="map"></div><div id="box">Device: <input id="dev" value="sim-1" size="8"><div id="info"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="config.js"></script>
<script>
const map = L.map('map').setView([26.9124, 75.7873], 16);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '© OpenStreetMap'}).addTo(map);
const rawLine = L.polyline([], {color: 'red', weight: 2}).addTo(map);
const corLine = L.polyline([], {color: 'green', weight: 4}).addTo(map);
let flagged = L.layerGroup().addTo(map), fit = false;
async function refresh() {
  try {
    const r = await fetch(`${window.API_URL}/api/v1/devices/${document.getElementById('dev').value}/points?limit=500`);
    const d = await r.json(); if (!d.length) return;
    rawLine.setLatLngs(d.map(p => [p.raw_lat, p.raw_lon]));
    corLine.setLatLngs(d.map(p => [p.lat, p.lon]));
    flagged.clearLayers();
    d.filter(p => p.trust < 60).forEach(p => L.circleMarker([p.raw_lat, p.raw_lon], {color: 'orange', radius: 6}).bindPopup(`trust ${p.trust}: ${p.flags}`).addTo(flagged));
    if (!fit) { map.fitBounds(corLine.getBounds()); fit = true; }
    const avg = Math.round(d.reduce((s, p) => s + p.trust, 0) / d.length);
    document.getElementById('info').innerHTML = `${d.length} pts · avg trust ${avg}<br><span style="color:red">■</span> raw <span style="color:green">■</span> corrected <span style="color:orange">●</span> flagged`;
  } catch (e) { console.error(e); }
}
refresh(); setInterval(refresh, 2000);
</script></body></html>
